replicaCount: 1
fullnameOverride: manufacturing-service
image:
  repository: 778127141920.dkr.ecr.ca-central-1.amazonaws.com/manufacturing-service
  # Placeholder — CI overwrites this with sha-<7chars> on the first develop build
  tag: latest
  pullPolicy: Always
service:
  type: ClusterIP
  port: 8085
  targetPort: 8085
# Internal only — exposed through api-gateway
ingress:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
livenessProbe:
  path: /actuator/health
  port: 8085
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
readinessProbe:
  path: /actuator/health/readiness
  port: 8085
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
configmap:
  SPRING_PROFILES_ACTIVE: dev
  LOG_LEVEL: DEBUG
  SERVER_PORT: "8085"
  # DB_HOST / DB_USERNAME / DB_PASSWORD come from the db-credentials secret
  DB_PORT: "5432"
  DB_NAME: pharmadb
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
envFrom:
  - secretRef:
      name: db-credentials
volumeMounts:
  - name: tmp
    mountPath: /tmp
volumes:
  - name: tmp
    emptyDir: {}
serviceAccount:
  create: true
  annotations: {}
  name: manufacturing-service
